<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="한글 수호대">
<meta name="theme-color" content="#221c18">
<title>한글 수호대 — 잃어버린 한글을 찾아서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Brush+Script&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<!--SUPABASE--><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><!--/SUPABASE-->
</head>
<body>
<div id="rotate" class="rotate"><p>아이패드를 <b>가로</b>로 돌려 주세요</p></div>

<section id="screen-join" class="screen join">
  <div class="join-inner">
    <h1 class="logo">한글 수호대</h1>
    <p class="sub">잃어버린 한글을 찾아서</p>
    <canvas id="join-cast" width="340" height="60" aria-hidden="true"></canvas>
    <div class="join-card">
      <div class="row" id="join-code-row"><label for="join-code">방 코드</label><input id="join-code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="숫자 4자리"></div>
      <div class="row" id="join-team-row"><label for="join-team">모둠</label>
        <select id="join-team"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select></div>
      <div class="row"><label for="join-name">닉네임</label><input id="join-name" maxlength="8" autocomplete="off" placeholder="예: 별빛"></div>
      <button id="join-btn" class="btn primary wide">입장하기</button>
      <p id="join-err" class="err" role="alert"></p>
      <p id="join-mode" class="note"></p>
    </div>
  </div>
</section>

<section id="screen-lobby" class="screen lobby hidden">
  <div class="lobby-inner panel"><h2 class="panel-title center">한글 수호대 대기실</h2><div id="lobby-body"></div></div>
</section>

<section id="screen-game" class="screen game hidden">
  <canvas id="cv"></canvas>
  <div id="hud-tl" class="hud tl">
    <div class="plate" id="map-name"></div>
    <div id="my-roles" class="roles"></div>
    <div id="tasks" class="tasks open">
      <button id="tasks-toggle" class="tasks-head">우리 모둠 할 일 <span id="tasks-count"></span></button>
      <ul id="tasks-list"></ul>
    </div>
  </div>
  <div id="hud-tr" class="hud tr">
    <button id="class-prog" class="class-prog" aria-label="우리 반 한글 복원판 열기">
      <span class="cp-label">우리 반 복원판</span>
      <span class="cp-bar"><span id="class-bar"></span></span>
      <span id="class-num" class="cp-num"></span>
    </button>
    <button id="btn-menu" class="icon-btn" aria-label="메뉴">☰</button>
  </div>
  <div id="boss-hud" class="boss-hud hidden"><span>묵귀</span><div class="bb"><div id="boss-bar"></div></div></div>
  <div id="banner" class="banner"></div>
  <div id="joy" class="joy" aria-label="이동 조이스틱"><div id="joy-knob" class="knob"></div></div>
  <div id="hud-br" class="hud br">
    <div class="tools">
      <button id="btn-hint" class="tool hidden">📜<span>힌트</span><b id="hint-count" class="badge">0</b></button>
      <button id="btn-map" class="tool hidden">🗺️<span>지도</span></button>
      <button id="btn-bag" class="tool">🎒<span>가방</span></button>
      <button id="btn-signal" class="tool">💬<span>신호</span></button>
    </div>
    <button id="act-btn" class="act">살펴보기</button>
  </div>
  <div id="boss-q" class="boss-q hidden"></div>
  <div id="ink-layer" class="ink-layer"></div>
</section>

<div id="dialog" class="dialog hidden" role="dialog" aria-live="polite">
  <div id="dlg-face" class="dlg-face"></div>
  <div class="dlg-body"><div id="dlg-name" class="dlg-name"></div><p id="dlg-text" class="dlg-text"></p><span class="dlg-more">▼ 눌러서 계속</span></div>
</div>
<div id="modal" class="modal hidden"><div id="modal-panel" class="panel"></div></div>
<div id="cutscene" class="cutscene hidden"></div>
<div id="pause" class="pause hidden"><p>선생님이 잠깐 멈췄어요</p><small>선생님 말씀을 들어 주세요</small></div>
<div id="fade" class="fade"></div>
<div id="toasts" class="toasts"></div>

<script src="js/config.js"></script>
<script src="js/content.js"></script>
<script src="js/art.js"></script>
<script src="js/audio.js"></script>
<script src="js/net.js"></script>
<script src="js/game.js"></script>
<script>
  /* 시작 화면 캐릭터 */
  window.addEventListener('DOMContentLoaded', function () {
    var c = document.getElementById('join-cast'), x = c.getContext('2d'); x.imageSmoothingEnabled = false;
    ['leader', 'quiz', 'detective', 'builder', 'keeper'].forEach(function (k, i) { x.drawImage(HS.sprite(k, 'down', i % 2), 10 + i * 56, 6, 48, 48); });
    x.drawImage(HS.mukdori(0), 294, 18, 36, 36);
  });
</script>
</body>
</html>
